name: Scorecard supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '30 6 * * 1'
  push:
    branches: [main]

# Least-privilege by default; the job below adds only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF results to the code-scanning dashboard.
      security-events: write
      # Publish results to OpenSSF so the public badge/API works.
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public OpenSSF API (badge, deps.dev).
          # Requires the repo to be public. Set false to keep results private.
          publish_results: true
          # Gives Branch-Protection & other checks full read access.
          # Create the SCORECARD_TOKEN secret (see gh commands below), then
          # uncomment. Without it those checks read as inconclusive.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: results.sarif
