name: CodeQL

# Advanced-setup CodeQL. Two things were wrong with the default setup:
#   1. Its bundled CodeQL (2.26.3) predates Kotlin 2.4.x extractor support, so tracing
#      the Kotlin compile crashed ("Could not read class … BigInteger.class" from the
#      JDK 21 image). Support for Kotlin 2.4.x landed in a later CodeQL — so we force the
#      newest CodeQL bundle with `tools: latest`.
#   2. build-mode: none cannot extract Kotlin (it does not compile) → no results for an
#      all-Kotlin repo. We use build-mode: manual and drive the compile ourselves.
#
# NOTE: disable the repo's default CodeQL setup first
# (Settings → Code security → Code scanning → CodeQL → switch to Advanced),
# otherwise GitHub rejects this workflow as conflicting.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for the workflow; the job escalates only what it needs.
permissions: read-all

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-and-quality
          # Pull the newest CodeQL CLI — its Kotlin extractor supports 2.4.x, unlike the
          # version bundled with the action (which crashed on this project's Kotlin).
          tools: latest

      # Compile only (no tests/detekt) so CodeQL traces the Kotlin compilation. Run
      # under CodeQL's tracer via the manual build step, not the failing autobuild.sh.
      - name: Compile (traced by CodeQL)
        run: ./gradlew --no-daemon compileKotlin compileTestKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:java-kotlin"
