version: 2
updates:
  # Gradle dependencies (transitive CVEs are forced in build-logic constraints;
  # this keeps direct deps and the catalog current).
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions — keeps the SHA-pinned actions current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Dockerfile base images — keeps the digest-pinned FROMs current.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
