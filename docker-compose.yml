services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
    volumes:
      - gateway-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    # Published image (deploy hosts `docker compose pull` this). `build:` stays
    # for local dev, so `docker compose build` still works against source.
    image: ghcr.io/gatewayauth/gateway:${GATEWAY_TAG:-latest}
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GATEWAY_ISSUER: "http://localhost:8080"
      GATEWAY_DB_URL: "jdbc:postgresql://db:5432/gateway"
      GATEWAY_DB_DRIVER: "org.postgresql.Driver"
      GATEWAY_DB_USER: "gateway"
      GATEWAY_DB_PASSWORD: "gateway"
      # Shared state (rate limit, MFA lockout, key-rotation lock) for multi-instance.
      GATEWAY_REDIS_URL: "redis://redis:6379"
      # Set true behind TLS in production.
      GATEWAY_COOKIE_SECURE: "false"
      # CHANGE both of these for any real deployment.
      GATEWAY_ADMIN_TOKEN: "change-me-admin-token"
      GATEWAY_ENC_KEY: "change-me-encryption-passphrase"
    ports:
      - "8080:8080"

  keychain:
    # Published image; `build:` (context is the sibling Keychain repo) keeps
    # local-dev parity. apiBase is read by the browser, so it must point at the
    # gateway as reachable from the host, not the compose network alias.
    image: ghcr.io/gatewayauth/keychain:${KEYCHAIN_TAG:-latest}
    build: ../Keychain
    depends_on:
      - gateway
    environment:
      NUXT_PUBLIC_API_BASE: "http://localhost:8080"
      NUXT_PUBLIC_TENANT_SLUG: "default"
    ports:
      - "3000:80"

volumes:
  gateway-db:
