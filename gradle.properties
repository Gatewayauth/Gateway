kotlin.code.style=official

# Kotlin IR backend OOMs on this module set with the default heap (CodeQL manual
# build hit "GC overhead limit exceeded" while tracing compileKotlin). Give the
# Gradle build JVM and the Kotlin compiler daemon room. ubuntu-latest has 16 GB.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx5g
