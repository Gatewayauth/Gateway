# Example reverse proxy for the Gateway stack (nginx).
#
# One public HTTPS origin fronts both services:
#   - Gateway backend (API)  -> published host port 8686
#   - Keychain SPA (portal)  -> published host port 3330
#
# Copy to your nginx sites dir, replace the example hostname and cert paths,
# and reload nginx. Not wired into docker-compose.yml on purpose — bring your
# own proxy (nginx/Caddy/Traefik).
#
# Also set on the backend for this origin:
#   GATEWAY_ISSUER=https://auth.example.com
#   GATEWAY_COOKIE_SECURE=true
# and on keychain:
#   NUXT_PUBLIC_API_BASE=https://auth.example.com   (API is same origin, under /t/)

upstream gateway_api  { server 127.0.0.1:8686; }
upstream keychain_spa { server 127.0.0.1:3330; }

# HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.example.com;

    ssl_certificate     /etc/ssl/example/auth.example.com.pem;
    ssl_certificate_key /etc/ssl/example/auth.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 2m;

    # --- Gateway backend (API) ---
    location /t/                { proxy_pass http://gateway_api; }
    location /api/provisioning/ { proxy_pass http://gateway_api; }
    location /healthz           { proxy_pass http://gateway_api; }
    location /swagger           { proxy_pass http://gateway_api; }

    # --- Keychain SPA (everything else) ---
    location / { proxy_pass http://keychain_spa; }

    # Shared proxy headers. The backend derives the OIDC issuer and external
    # redirect URIs from these, so forward the real host/proto.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
}
