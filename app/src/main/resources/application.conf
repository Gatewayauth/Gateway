ktor {
  deployment {
    port = 8080
    port = ${?PORT}
  }
  application {
    modules = [
      io.gateway.app.ApplicationKt.module
    ]
  }
}

gateway {
  # Externally reachable base URL. MUST match relying-party configuration (OIDC `iss`).
  issuer = "http://localhost:8080"
  issuer = ${?GATEWAY_ISSUER}

  db {
    # Defaults to in-memory H2 for zero-config local runs. Point at Postgres in prod.
    url = "jdbc:h2:mem:gateway;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    url = ${?GATEWAY_DB_URL}
    driver = "org.h2.Driver"
    driver = ${?GATEWAY_DB_DRIVER}
    user = "sa"
    user = ${?GATEWAY_DB_USER}
    password = ""
    password = ${?GATEWAY_DB_PASSWORD}
    maxPoolSize = 10
  }

  session {
    ttlHours = 12
    cookieName = "gw_session"
    # Set false only for local http development.
    cookieSecure = true
    cookieSecure = ${?GATEWAY_COOKIE_SECURE}
  }

  admin {
    # Bootstrap token for the admin API. Leave empty to disable admin endpoints.
    token = ""
    token = ${?GATEWAY_ADMIN_TOKEN}
  }

  security {
    # Passphrase for deriving AES-GCM (TOTP secret) and HMAC (MFA challenge) keys.
    # CHANGE THIS in production; rotating it invalidates stored TOTP secrets.
    encKey = "dev-insecure-change-me"
    encKey = ${?GATEWAY_ENC_KEY}
  }

  mail {
    # Base URL for links in verification / reset emails (defaults to issuer).
    linkBaseUrl = ${?GATEWAY_MAIL_LINK_BASE_URL}

    # SMTP delivery. When host is set the SMTP mailer is used; otherwise emails are logged.
    smtp {
      host = ${?GATEWAY_SMTP_HOST}
      port = "587"
      port = ${?GATEWAY_SMTP_PORT}
      username = ${?GATEWAY_SMTP_USERNAME}
      password = ${?GATEWAY_SMTP_PASSWORD}
      from = "no-reply@gateway.local"
      from = ${?GATEWAY_SMTP_FROM}
      startTls = "true"
      startTls = ${?GATEWAY_SMTP_STARTTLS}
    }
  }

  keys {
    # Days between automatic signing-key rotations. 0 disables auto-rotation.
    rotationDays = "0"
    rotationDays = ${?GATEWAY_KEY_ROTATION_DAYS}
  }

  cors {
    # Comma-separated browser origins allowed to call the API with credentials.
    origins = "http://localhost:3000"
    origins = ${?GATEWAY_CORS_ORIGINS}
  }

  redis {
    # Optional. When set (redis://host:port), rate limiting, MFA lockout and key-rotation
    # coordination use Redis so multiple instances share state. Empty = in-memory (single instance).
    url = ${?GATEWAY_REDIS_URL}
  }

  external {
    # Where to send the browser after a successful external login.
    # Defaults to the first CORS origin (the frontend UI), e.g. http://localhost:3000.
    postLoginRedirect = ${?GATEWAY_EXTERNAL_POST_LOGIN_REDIRECT}
    # A provider activates only when both clientId and clientSecret are set.
    google {
      clientId = ${?GATEWAY_GOOGLE_CLIENT_ID}
      clientSecret = ${?GATEWAY_GOOGLE_CLIENT_SECRET}
    }
    github {
      clientId = ${?GATEWAY_GITHUB_CLIENT_ID}
      clientSecret = ${?GATEWAY_GITHUB_CLIENT_SECRET}
    }
    discord {
      clientId = ${?GATEWAY_DISCORD_CLIENT_ID}
      clientSecret = ${?GATEWAY_DISCORD_CLIENT_SECRET}
    }
  }
}
